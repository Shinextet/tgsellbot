services:
  - type: web
    name: telegram-sell-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: GROUP_ID
        sync: false
      - key: ADMIN_GROUP_ID
        sync: false
      - key: RECEIPT_CHAT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PORT
        value: 8080
      - key: ORDER_TIMEOUT_MINUTES
        value: 15
      - key: RATE_LIMIT_MAX_ACTIONS
        value: 6
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 10
